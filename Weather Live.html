<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyCast - Weather Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #4a6fa5;
            --secondary-color: #6b8cbc;
            --accent-color: #ff9e44;
            --text-color: #f5f5f5;
            --card-bg: rgba(255, 255, 255, 0.15);
            --transition-speed: 0.5s;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #4a6fa5, #6b8cbc);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background var(--transition-speed) ease;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo i {
            font-size: 2rem;
            color: var(--accent-color);
        }

        .logo h1 {
            font-size: 1.8rem;
            font-weight: 600;
        }

        .controls {
            display: flex;
            gap: 1rem;
        }

        .search-container {
            position: relative;
        }

        .search-container input {
            padding: 0.7rem 1rem 0.7rem 2.5rem;
            border: none;
            border-radius: 30px;
            background: var(--card-bg);
            color: var(--text-color);
            width: 250px;
            font-size: 1rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .search-container i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-color);
            opacity: 0.7;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .toggle-label {
            font-size: 0.9rem;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.3);
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-color);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        .weather-display {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .current-weather {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease;
        }

        .current-weather:hover {
            transform: translateY(-5px);
        }

        .location {
            margin-bottom: 1rem;
        }

        .location h2 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .location p {
            opacity: 0.8;
            font-size: 1rem;
        }

        .weather-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 1.5rem 0;
        }

        .temperature {
            font-size: 4rem;
            font-weight: 300;
        }

        .weather-icon {
            font-size: 5rem;
            color: var(--accent-color);
        }

        .weather-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1rem;
        }

        .detail {
            display: flex;
            align-items: center;
            gap: 0.7rem;
        }

        .detail i {
            font-size: 1.2rem;
            opacity: 0.8;
        }

        .forecast {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .forecast h3 {
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        .forecast-items {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1rem;
        }

        .forecast-item {
            text-align: center;
            padding: 1rem;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .forecast-item:hover {
            transform: translateY(-5px);
        }

        .forecast-day {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .forecast-icon {
            font-size: 2rem;
            margin: 0.5rem 0;
            color: var(--accent-color);
        }

        .forecast-temp {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .weather-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .sun {
            position: absolute;
            top: 10%;
            right: 10%;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #ffd700, transparent 70%);
            border-radius: 50%;
            box-shadow: 0 0 50px #ffd700;
            animation: float 20s infinite ease-in-out;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            animation: float 15s infinite ease-in-out;
        }

        .cloud-1 {
            width: 120px;
            height: 40px;
            top: 20%;
            left: 5%;
            animation-delay: 0s;
        }

        .cloud-2 {
            width: 150px;
            height: 50px;
            top: 30%;
            right: 15%;
            animation-delay: 2s;
        }

        .cloud-3 {
            width: 100px;
            height: 30px;
            top: 60%;
            left: 20%;
            animation-delay: 4s;
        }

        .rain {
            position: absolute;
            width: 2px;
            height: 15px;
            background: rgba(255, 255, 255, 0.7);
            animation: rain-fall 1.5s infinite linear;
            opacity: 0;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
            }
            25% {
                transform: translateY(-20px) translateX(10px);
            }
            50% {
                transform: translateY(0) translateX(20px);
            }
            75% {
                transform: translateY(20px) translateX(10px);
            }
        }

        @keyframes rain-fall {
            0% {
                transform: translateY(-100px);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(100px);
                opacity: 0;
            }
        }

        footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .weather-display {
                grid-template-columns: 1fr;
            }
            
            .forecast-items {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .search-container input {
                width: 200px;
            }
        }

        @media (max-width: 480px) {
            header {
                flex-direction: column;
                gap: 1rem;
            }
            
            .controls {
                width: 100%;
                justify-content: space-between;
            }
            
            .search-container input {
                width: 180px;
            }
            
            .forecast-items {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .temperature {
                font-size: 3rem;
            }
            
            .weather-icon {
                font-size: 4rem;
            }
        }
    </style>
</head>
<body>
    <div class="weather-background" id="weatherBackground">
        <div class="sun"></div>
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
    </div>

    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-cloud-sun"></i>
                <h1>SkyCast</h1>
            </div>
            <div class="controls">
                <div class="search-container">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search city...">
                </div>
                <div class="toggle-container">
                    <span class="toggle-label">Mood Mode</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="moodToggle">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </header>

        <main>
            <div class="weather-display">
                <div class="current-weather">
                    <div class="location">
                        <h2 id="cityName">San Francisco</h2>
                        <p id="currentDate">Monday, June 12</p>
                    </div>
                    <div class="weather-main">
                        <div class="temperature">
                            <span id="currentTemp">72</span>°F
                        </div>
                        <div class="weather-icon">
                            <i id="weatherIcon" class="fas fa-sun"></i>
                        </div>
                    </div>
                    <div class="weather-description">
                        <p id="weatherDesc">Sunny</p>
                    </div>
                    <div class="weather-details">
                        <div class="detail">
                            <i class="fas fa-wind"></i>
                            <span id="windSpeed">5 mph</span>
                        </div>
                        <div class="detail">
                            <i class="fas fa-tint"></i>
                            <span id="humidity">65%</span>
                        </div>
                        <div class="detail">
                            <i class="fas fa-temperature-low"></i>
                            <span id="feelsLike">74°F</span>
                        </div>
                        <div class="detail">
                            <i class="fas fa-eye"></i>
                            <span id="visibility">10 mi</span>
                        </div>
                    </div>
                </div>

                <div class="forecast">
                    <h3>5-Day Forecast</h3>
                    <div class="forecast-items" id="forecastContainer">
                        <!-- Forecast items will be dynamically added here -->
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>SkyCast &copy; 2023 | Weather data powered by OpenWeather API</p>
        </footer>
    </div>

    <script>
        // DOM Elements
        const searchInput = document.getElementById('searchInput');
        const moodToggle = document.getElementById('moodToggle');
        const cityName = document.getElementById('cityName');
        const currentDate = document.getElementById('currentDate');
        const currentTemp = document.getElementById('currentTemp');
        const weatherIcon = document.getElementById('weatherIcon');
        const weatherDesc = document.getElementById('weatherDesc');
        const windSpeed = document.getElementById('windSpeed');
        const humidity = document.getElementById('humidity');
        const feelsLike = document.getElementById('feelsLike');
        const visibility = document.getElementById('visibility');
        const forecastContainer = document.getElementById('forecastContainer');
        const weatherBackground = document.getElementById('weatherBackground');

        // Current date
        const now = new Date();
        const options = { weekday: 'long', month: 'long', day: 'numeric' };
        currentDate.textContent = now.toLocaleDateString('en-US', options);

        // Weather data (simulated - in a real app, this would come from an API)
        const weatherData = {
            city: "San Francisco",
            temperature: 72,
            description: "Sunny",
            icon: "fa-sun",
            wind: 5,
            humidity: 65,
            feelsLike: 74,
            visibility: 10,
            forecast: [
                { day: "Tue", icon: "fa-cloud-sun", temp: 70 },
                { day: "Wed", icon: "fa-cloud", temp: 68 },
                { day: "Thu", icon: "fa-cloud-showers-heavy", temp: 65 },
                { day: "Fri", icon: "fa-sun", temp: 72 },
                { day: "Sat", icon: "fa-cloud-sun", temp: 71 }
            ]
        };

        // Update UI with weather data
        function updateWeatherUI(data) {
            cityName.textContent = data.city;
            currentTemp.textContent = data.temperature;
            weatherIcon.className = `fas ${data.icon}`;
            weatherDesc.textContent = data.description;
            windSpeed.textContent = `${data.wind} mph`;
            humidity.textContent = `${data.humidity}%`;
            feelsLike.textContent = `${data.feelsLike}°F`;
            visibility.textContent = `${data.visibility} mi`;

            // Update forecast
            forecastContainer.innerHTML = '';
            data.forecast.forEach(day => {
                const forecastItem = document.createElement('div');
                forecastItem.className = 'forecast-item';
                forecastItem.innerHTML = `
                    <div class="forecast-day">${day.day}</div>
                    <div class="forecast-icon"><i class="fas ${day.icon}"></i></div>
                    <div class="forecast-temp">${day.temp}°F</div>
                `;
                forecastContainer.appendChild(forecastItem);
            });

            // Update background based on weather
            updateWeatherBackground(data.description);
        }

        // Update background based on weather condition
        function updateWeatherBackground(description) {
            // Clear existing background elements except sun and clouds
            const rainElements = document.querySelectorAll('.rain');
            rainElements.forEach(el => el.remove());

            // Reset background gradient
            document.body.style.background = 'linear-gradient(135deg, #1a2a6c, #4a6fa5, #6b8cbc)';

            // Add elements based on weather
            if (description.toLowerCase().includes('rain')) {
                // Add rain
                for (let i = 0; i < 50; i++) {
                    const rain = document.createElement('div');
                    rain.className = 'rain';
                    rain.style.left = `${Math.random() * 100}%`;
                    rain.style.animationDelay = `${Math.random() * 2}s`;
                    weatherBackground.appendChild(rain);
                }
                
                // Change background for rain
                if (moodToggle.checked) {
                    document.body.style.background = 'linear-gradient(135deg, #2c3e50, #4a6fa5, #7f8c8d)';
                }
            } else if (description.toLowerCase().includes('cloud')) {
                // Change background for clouds
                if (moodToggle.checked) {
                    document.body.style.background = 'linear-gradient(135deg, #636e72, #81a1c1, #a3be8c)';
                }
            } else if (description.toLowerCase().includes('sun')) {
                // Change background for sunny
                if (moodToggle.checked) {
                    document.body.style.background = 'linear-gradient(135deg, #4a6fa5, #6b8cbc, #ff9e44)';
                }
            }
        }

        // Initialize with default data
        updateWeatherUI(weatherData);

        // Event listeners
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                // In a real app, this would call the API with the search term
                const newCity = searchInput.value || 'San Francisco';
                const newData = {...weatherData, city: newCity};
                updateWeatherUI(newData);
                searchInput.value = '';
            }
        });

        moodToggle.addEventListener('change', function() {
            // Re-apply background based on current weather when mood mode is toggled
            updateWeatherBackground(weatherDesc.textContent);
        });

        // Add some random raindrops for demo purposes
        setTimeout(() => {
            if (!document.querySelector('.rain')) {
                for (let i = 0; i < 30; i++) {
                    const rain = document.createElement('div');
                    rain.className = 'rain';
                    rain.style.left = `${Math.random() * 100}%`;
                    rain.style.animationDelay = `${Math.random() * 2}s`;
                    weatherBackground.appendChild(rain);
                }
                
                // Change description to show rain
                weatherDesc.textContent = "Light Rain";
                weatherIcon.className = "fas fa-cloud-rain";
                
                // Update forecast for rain
                const forecastItems = document.querySelectorAll('.forecast-item');
                forecastItems[2].querySelector('.forecast-icon i').className = "fas fa-cloud-rain";
            }
        }, 5000);
    </script>
</body>
</html>
